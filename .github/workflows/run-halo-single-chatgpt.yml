name: Run HALO single-agent ChatGPT experiment

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Number of repetitions for every article-question pair
        required: true
        default: "1"
      max_articles:
        description: "Maximum number of articles (0 = all articles; keep 1 for a test)"
        required: true
        default: "1"
      max_questions_per_article:
        description: "Maximum questions per article (0 = all questions; keep 1 for a test)"
        required: true
        default: "1"
      question_offset:
        description: "Number of article-question pairs to skip (0 = start)"
        required: true
        default: "0"
      max_total_questions:
        description: "Maximum total questions in this batch (0 = all questions)"
        required: true
        default: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create run configuration
        run: |
          cp config/halo_single_chatgpt_batch.example.json config/halo_single_chatgpt_batch.json
          python -c "import json; p='config/halo_single_chatgpt_batch.json'; d=json.load(open(p)); d['repetitions']=int('${{ inputs.repetitions }}'); d['max_articles']=int('${{ inputs.max_articles }}'); d['max_questions_per_article']=int('${{ inputs.max_questions_per_article }}'); d['question_offset']=int('${{ inputs.question_offset }}'); d['max_total_questions']=int('${{ inputs.max_total_questions }}'); open(p,'w').write(json.dumps(d, ensure_ascii=False, indent=2)+'\\n')"
      - name: Run single-agent experiment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python run_multi_experiment.py --config config/halo_single_chatgpt_batch.json --run-id github-${{ github.run_id }}
      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: halo-single-chatgpt-results-${{ github.run_id }}
          path: results/github-${{ github.run_id }}/

