name: Run HALO 2.0 primary experiment

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Frozen question scope (full = all 66 questions; batches are pre-registered cost-limited slices)
        required: true
        default: full
        type: choice
        options: [full, batch_01, batch_02, batch_03, batch_04]
      condition:
        description: Experimental condition to run
        required: true
        default: all
        type: choice
        options: [all, single_raw, single_gated, multi_raw, multi_gated]
      dry_run:
        description: Keep true to validate with no API calls; set false only for a funded live run
        required: true
        default: true
        type: boolean
      live_run_confirmation:
        description: Required only when dry_run is false
        required: true
        default: DO_NOT_RUN
        type: choice
        options: [DO_NOT_RUN, RUN_FUNDED_PRIMARY]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard live-run approval
        shell: bash
        run: |
          if [ "${{ inputs.dry_run }}" = "false" ] && [ "${{ inputs.live_run_confirmation }}" != "RUN_FUNDED_PRIMARY" ]; then
            echo "Live API calls require RUN_FUNDED_PRIMARY confirmation."
            exit 2
          fi
          if [ "${{ inputs.dry_run }}" = "false" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is not configured."
            exit 2
          fi
      - name: Verify frozen configuration and batch plan
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          test -f "config/halo_v2_primary/${{ inputs.scope }}/primary_execution_freeze.json"
      - name: Run selected condition or all conditions
        shell: bash
        run: |
          scope="${{ inputs.scope }}"
          selected="${{ inputs.condition }}"
          run_one() {
            name="$1"
            args=(--config "config/halo_v2_primary/${scope}/halo_v2_primary.${name}.json" --output-root "results/halo_v2_primary/${{ github.run_id }}" --run-id "${scope}-${name}")
            if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
            python run_multi_experiment.py "${args[@]}"
          }
          if [ "$selected" = "all" ]; then
            for name in single_raw single_gated multi_raw multi_gated; do run_one "$name"; done
          else
            run_one "$selected"
          fi
      - name: Upload run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halo-v2-${{ inputs.scope }}-${{ inputs.condition }}-${{ github.run_id }}
          path: results/halo_v2_primary/${{ github.run_id }}
          if-no-files-found: warn
