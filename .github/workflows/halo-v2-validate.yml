name: Validate HALO 2.0 framework

on:
  workflow_dispatch:
  push:
    branches:
      - feature/halo-2-pipeline

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit and integration-safe tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Check HALO 2.0 CLI
        env:
          PYTHONPATH: src
        run: python run_halo_v2.py --help
